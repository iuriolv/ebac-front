
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parquímetro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Parquímetro</h1>
    </header>
    <main class="container">
        <section class="content">
            <h2>Valores</h2>
            <div id="valores"></div>
        </section>
        <section class="form">
            <input type="number" id="tempo" placeholder="Tempo de permanência">
            <input type="number" id="valor" placeholder="Valor pago em reais">
            <button type="button" id="calcular">Calcular</button>
        </section>
    </main>
    <footer>
        <div id="resultado">
            <p id="status"></p>
            <p id="troco"></p>
        </div>
    </footer>
    <script type="module" src="js/app.js"></script>
</body>
</html>
